name: SSSB Scraper

on:
  schedule:
    # --- MÅNDAGAR (Deadline 10:00 Svensk tid) ---
    # Sommartid (UTC+2): 07:50, 07:55, 07:58 UTC
    - cron: '50 7 * * 1'
    - cron: '55 7 * * 1'
    - cron: '58 7 * * 1'
    # Vintertid (UTC+1): 08:50, 08:55, 08:58 UTC
    - cron: '50 8 * * 1'
    - cron: '55 8 * * 1'
    - cron: '58 8 * * 1'

    # --- TORSDAGAR (Deadline 16:00 Svensk tid) ---
    # Sommartid (UTC+2): 13:50, 13:55, 13:58 UTC
    - cron: '50 13 * * 4'
    - cron: '55 13 * * 4'
    - cron: '58 13 * * 4'
    # Vintertid (UTC+1): 14:50, 14:55, 14:58 UTC
    - cron: '50 14 * * 4'
    - cron: '55 14 * * 4'
    - cron: '58 14 * * 4'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data [skip ci]" && git push)