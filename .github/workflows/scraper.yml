name: SSSB Scraper

on:
  schedule:
    # --- MÅNDAGAR (Deadline 15:55 Svensk tid) ---
    # Körs 13:55 UTC (Blir 15:55 på Sommar / 14:55 på Vinter)
    - cron: '55 13 * * 1'
    # Körs 14:55 UTC (Blir 16:55 på Sommar / 15:55 på Vinter - RÄTT PÅ VINTERN!)
    - cron: '55 14 * * 1'

    # --- TORSDAGAR (Deadline 09:55 Svensk tid) ---
    # Körs 07:55 UTC (Blir 09:55 på Sommar / 08:55 på Vinter)
    - cron: '55 7 * * 4'
    # Körs 08:55 UTC (Blir 10:55 på Sommar / 09:55 på Vinter - RÄTT PÅ VINTERN!)
    - cron: '55 8 * * 4'

  # Låter oss köra manuellt vid behov
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data [skip ci]" && git push)