name: SSSB Scraper

on:
  schedule:
    # 1. VARJE morgon: 07:55 UTC 
    # = 09:55 på sommaren (Perfekt inför 10:00-deadline)
    # = 08:55 på vintern (Säkert)
    - cron: '55 7 * * *'

    # 2. BARA Måndagar: 13:55 UTC
    # = 15:55 på sommaren (Perfekt inför 16:00-deadline)
    # = 14:55 på vintern (Säkert)
    - cron: '55 13 * * 1'

  workflow_dispatch:      # Gör att du fortfarande kan starta den manuellt

permissions:
  contents: write

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data" && git push)