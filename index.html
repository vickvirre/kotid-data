<!DOCTYPE html>
<html lang="sv" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bostadskoden | SSSB Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        jitter: {
                            bg: '#050507',
                            card: 'rgba(255, 255, 255, 0.03)',
                            border: 'rgba(255, 255, 255, 0.1)',
                        }
                    },
                    animation: {
                        'blob': 'blob 10s infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050507; color: white; overflow-x: hidden; }
        
        .glass-card {
            background: rgba(20, 20, 25, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
        }

        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid #60A5FA;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="relative min-h-screen">

    <div class="fixed top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
        <div class="absolute top-0 left-1/4 w-[500px] h-[500px] bg-purple-600/20 rounded-full mix-blend-screen filter blur-[100px] opacity-50 animate-blob"></div>
        <div class="absolute top-1/4 right-1/4 w-[400px] h-[400px] bg-blue-600/20 rounded-full mix-blend-screen filter blur-[100px] opacity-50 animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-32 left-1/3 w-[600px] h-[600px] bg-pink-600/10 rounded-full mix-blend-screen filter blur-[100px] opacity-40 animate-blob animation-delay-4000"></div>
    </div>

    <nav class="relative z-50 flex justify-between items-center max-w-6xl mx-auto px-6 py-8">
        <div class="text-xl font-bold tracking-tight">Bostadskoden</div>
        <a href="https://hpkoden.se" class="text-sm font-semibold text-gray-400 hover:text-white transition">Gå till HPKoden →</a>
    </nav>

    <main class="relative z-10 max-w-5xl mx-auto px-6 pt-10 pb-20">

        <div class="text-center mb-20 animate-float">
            <h1 class="text-6xl md:text-8xl font-bold tracking-tighter mb-6 leading-tight">
                Hitta hem <br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400">snabbare.</span>
            </h1>
            <p class="text-xl text-gray-400 max-w-xl mx-auto mb-10">
                Sluta gissa. Vi spårar SSSB:s ködagar i realtid så att du vet exakt vart du ska söka.
            </p>
            
            <a href="#calculator-section" class="inline-flex items-center px-8 py-4 rounded-full bg-white text-black font-bold text-lg hover:scale-105 transition-transform shadow-[0_0_40px_-10px_rgba(255,255,255,0.5)]">
                Testa mina ködagar
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-32">

            <div class="glass-card p-8 lg:col-span-2 relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-64 h-64 bg-blue-500/10 rounded-full blur-[60px] group-hover:bg-blue-500/20 transition duration-700"></div>
                
                <div class="relative z-10">
                    <h3 class="text-gray-400 text-sm font-semibold uppercase tracking-wider mb-2">Genomsnittlig kötid (Aktiva just nu)</h3>
                    <div class="flex items-baseline gap-4">
                        <span id="avg-days" class="text-7xl font-bold text-white tracking-tighter"><div class="loader"></div></span>
                        <span class="text-xl text-gray-400">dagar</span>
                    </div>
                    <div class="mt-8 h-2 w-full bg-gray-800 rounded-full overflow-hidden">
                        <div class="h-full bg-gradient-to-r from-blue-500 to-purple-500 w-[65%] rounded-full shadow-[0_0_15px_rgba(59,130,246,0.5)]"></div>
                    </div>
                    <p class="mt-3 text-sm text-gray-500">Baserat på <span id="total-count">...</span> bostäder som ligger ute nu</p>
                </div>
            </div>

            <div class="glass-card p-8 relative overflow-hidden group">
                <div class="absolute bottom-0 left-0 w-full h-full bg-gradient-to-t from-green-500/10 to-transparent opacity-0 group-hover:opacity-100 transition duration-500"></div>
                <h3 class="text-gray-400 text-sm font-semibold uppercase tracking-wider mb-
